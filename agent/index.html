<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Brady Agent · v0.4</title><link rel="stylesheet" href="agent.css"></head>
<body><main class="app">
<header><a href="/" class="brand"><span>BC</span><div><strong>Brady Agent</strong><small>PERSONAL AI · v0.4</small></div></a><div class="header-actions"><button id="memoryBtn" type="button" class="hidden">记忆</button><button id="ownerLogin" type="button">Owner 登录</button><button id="clear" type="button">新对话</button></div></header>
<section id="chat" class="chat"><div class="welcome"><p class="eyebrow" id="roleLabel">VISITOR MODE</p><h1 id="greeting">你好，欢迎使用 Brady Agent。</h1><p id="welcomeText">当前为访客模式。你可以正常使用 AI；Owner 私人记忆不会向访客开放。</p><div class="chips"><button>帮我处理一个制冷问题</button><button>策划一个 AI 视频</button><button>开始今天的英语练习</button><button>整理我的学习计划</button></div></div></section>
<form id="composer"><textarea id="input" rows="1" placeholder="告诉 Brady Agent 你想做什么…" autofocus></textarea><button id="send" type="submit" aria-label="发送">↑</button></form>
<p class="note">v0.4 · Brady Agent · <span id="modeNote">访客模式</span></p></main>
<div id="memoryPanel" class="memory-panel hidden">
  <div class="memory-card">
    <div class="memory-head"><div><strong>长期记忆</strong><small>只有 Owner 可以查看和管理</small></div><button id="memoryClose" type="button">×</button></div>
    <div class="memory-add"><select id="memoryCategory"><option value="general">一般</option><option value="profile">个人</option><option value="preference">偏好</option><option value="project">项目</option><option value="work">工作</option><option value="learning">学习</option></select><input id="memoryInput" placeholder="手动补充一条长期记忆"><button id="memoryAdd" type="button">添加</button></div>
    <div id="memoryList" class="memory-list"></div>
  </div>
</div>
<script src="agent.js"></script></body></html>
